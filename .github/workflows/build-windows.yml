name: build-windows

# Builds the Windows installer (NSIS) on a real Windows runner and proves the
# installed app starts its editor server there — the one question a Mac cannot
# answer. Manual: run it on a branch to check, or give it a release tag to
# attach the installer to.
#
# What the smoke test proves: the installer installs silently, the app
# launches with a folder argument, finds node, spawns the sidecar, the sidecar
# serves the page and refuses /api without the launch token, and a force-killed
# app leaves no server behind. What it cannot prove: the agent panel, which
# needs a Claude Code login no runner has.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or tag to build"
        required: true
        default: "main"
      tag:
        description: "Release tag to attach the installer to (leave empty to only build and test)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install deps, build the frontend, stage the sidecar
        shell: bash
        run: |
          # Plain npm ci: the Tauri CLI ships its platform binary as an optional
          # dependency, so --omit=optional here would leave no tauri to run. The
          # sidecar is staged with its own --omit=optional install.
          npm ci
          npm run build
          ./scripts/stage-sidecar.sh

      - name: Build the installer
        run: npx tauri build --bundles nsis

      - name: Install it and prove the app starts its server
        shell: pwsh
        run: |
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          if (-not $setup) { throw "no NSIS installer was produced" }
          Write-Host "installer: $($setup.Name) $([math]::Round($setup.Length / 1MB, 1)) MB"
          Start-Process $setup.FullName -ArgumentList '/S' -Wait

          $roots = @("$env:LOCALAPPDATA\fethr", "$env:ProgramFiles\fethr")
          $exe = Get-ChildItem $roots -Filter *.exe -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -notmatch 'uninstall' } | Select-Object -First 1
          if (-not $exe) { throw "installed app not found under $($roots -join ', ')" }
          Write-Host "installed: $($exe.FullName)"

          $ws = New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\ws"
          Set-Content "$ws\app.js" 'x = 1'
          $app = Start-Process $exe.FullName -ArgumentList "`"$($ws.FullName)`"" -PassThru

          $node = $null
          foreach ($i in 1..45) {
            $node = Get-CimInstance Win32_Process -Filter "Name='node.exe'" |
              Where-Object { $_.CommandLine -match 'sidecar' } | Select-Object -First 1
            if ($node) { break }
            Start-Sleep 1
          }
          if (-not $node) { throw "the sidecar never started (node not found, or the spawn failed)" }
          Write-Host "sidecar: pid $($node.ProcessId), parent $($node.ParentProcessId), app $($app.Id)"
          Write-Host "command: $($node.CommandLine)"

          $port = $null
          foreach ($i in 1..20) {
            $port = (Get-NetTCPConnection -OwningProcess $node.ProcessId -State Listen -ErrorAction SilentlyContinue |
              Select-Object -First 1).LocalPort
            if ($port) { break }
            Start-Sleep 1
          }
          if (-not $port) { throw "the sidecar is running but not listening" }

          $page = curl.exe -s -o NUL -w "%{http_code}" "http://127.0.0.1:$port/"
          $api  = curl.exe -s -o NUL -w "%{http_code}" "http://127.0.0.1:$port/api/meta"
          Write-Host "page: $page   /api/meta without token: $api"
          if ($page -ne "200") { throw "the editor page did not load ($page)" }
          if ($api -ne "401") { throw "/api answered $api without a token; expected 401" }

          Stop-Process -Id $app.Id -Force
          $gone = $false
          foreach ($i in 1..15) {
            if (-not (Get-Process -Id $node.ProcessId -ErrorAction SilentlyContinue)) { $gone = $true; break }
            Start-Sleep 1
          }
          if (-not $gone) { throw "the sidecar outlived a force-killed app" }
          Write-Host "force-kill left no server behind"

      - uses: actions/upload-artifact@v4
        with:
          name: fethr-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Attach to the release
        if: inputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.tag }}" src-tauri/target/release/bundle/nsis/*.exe --repo evojewel/fethr --clobber
