<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>fethr — a featherweight code editor with first-class agent integration</title>
<meta name="description" content="fethr is a featherweight code editor with first-class AI agent integration — minimal, fast, and built around the agent as a peer process. Under construction.">
<link rel="canonical" href="https://fethr.dev/">
<meta property="og:title" content="fethr">
<meta property="og:description" content="A featherweight code editor with first-class agent integration. Under construction.">
<meta property="og:url" content="https://fethr.dev/">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="fethr">
<meta name="twitter:description" content="A featherweight code editor with first-class agent integration.">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "SoftwareApplication",
  "name": "fethr",
  "url": "https://fethr.dev/",
  "description": "A featherweight code editor with first-class AI agent integration. Under construction.",
  "applicationCategory": "DeveloperApplication",
  "operatingSystem": "macOS",
  "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },

<style>
  :root { --bg: #101312; --ink: #e8ece9; --muted: #8fa098; --accent: #6fd3b2; }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f7f9f8; --ink: #17211d; --muted: #5c6d64; --accent: #0e7a58; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: var(--bg); color: var(--ink);
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
  }
  main { text-align: center; padding: 32px; max-width: 560px; }
  h1 {
    font-size: 4rem; margin: 0 0 8px; font-weight: 300; letter-spacing: 0.04em;
  }
  h1 span { color: var(--accent); }
  p.tag { font-size: 1.15rem; color: var(--muted); margin: 0 0 28px; line-height: 1.5; }
  code {
    display: inline-block; font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 0.95rem; color: var(--ink);
    border: 1px solid var(--muted); border-radius: 8px; padding: 10px 18px;
    margin-bottom: 28px;
  }
  a { color: var(--accent); text-decoration: none; font-size: 0.95rem; }
  a:hover { text-decoration: underline; }
  .status {
    font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.18em;
    color: var(--muted); margin-top: 40px;
  }
</style>
</head>
<body>
<main>
  <h1>fethr<span>.</span></h1>
  <p class="tag">A featherweight code editor with first-class agent integration.</p>
  <code>npx @evojewel/fethr@alpha .</code>
  <br>
  <a href="https://github.com/evojewel/fethr">github.com/evojewel/fethr</a>
  <p class="status">alpha — file tree · syntax highlighting · edit &amp; save · no electron</p>
</main>
</body>
</html>
